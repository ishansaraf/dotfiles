set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Helix/vim need <Esc> delivered immediately.
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000

# Copies go to the laptop clipboard via OSC 52, which works over SSH/mosh.
set -g set-clipboard on
set -g allow-passthrough on

setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

set -g status-position top
# Gruvbox Material Dark (medium) palette.
set -g status-style "bg=#32302f,fg=#d4be98"
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#45403d,fg=#d4be98"
set -g mode-style "bg=#45403d,fg=#ddc7a1"
set -g status-left "#[fg=#282828,bg=#a9b665,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#928374]#h  #[fg=#d4be98]%H:%M "
setw -g window-status-style "fg=#928374"
setw -g window-status-current-style "fg=#282828,bg=#d8a657,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-processes 'hx "~claude"'

run '~/.tmux/plugins/tpm/tpm'
