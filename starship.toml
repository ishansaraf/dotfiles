add_newline = false
command_timeout = 2000

palette = "gruvbox_material"

format = "$hostname$directory$git_branch$git_state$git_status$python$cmd_duration$line_break$character"

[hostname]
ssh_only = true
format = "[$hostname]($style) "

[directory]
truncation_length = 4
truncate_to_repo = false

[git_status]
# The dirt checkout is large; the fsmonitor in personalize keeps this fast.
ignore_submodules = true

[cmd_duration]
min_time = 5_000
show_notifications = false

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[python]
format = '[(\($virtualenv\) )]($style)'


[palettes.gruvbox_material]
red = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green = "#a9b665"
aqua = "#89b482"
cyan = "#89b482"
blue = "#7daea3"
purple = "#d3869b"
white = "#d4be98"
