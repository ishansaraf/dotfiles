onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "symbols"
pane_gaps = true

# $setup is the progress token that `wt` reports while a new worktree's env bootstraps.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status", "$setup"]]

[theme]
name = "gruvbox"
auto_switch = false

# Unset, the sidebar shares the terminal background (#282828) and blends into the panes.
[theme.custom]
sidebar_bg = "#2c2b2a"
